name: retag (one-off privacy fix)
on:
  push:
    branches: [main]
    paths: [ops/retag.txt]
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Move release tags to the rewritten commits
        run: |
          while read -r t s; do
            [ -n "$t" ] || continue
            git cat-file -e "$s^{commit}" || { echo "missing $s"; exit 1; }
            git push --force origin "$s:refs/tags/$t"
            echo "moved $t -> $s"
          done < ops/retag.txt
