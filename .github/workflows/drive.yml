name: fetch-drive
on:
  push:
    paths: ["drive/wanted.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    concurrency: drive-cache
    steps:
      - uses: actions/checkout@v4
      - name: Download requested public Drive files to an orphan branch
        run: |
          # keep the files of other runs (parallel story makers): start from the current drive-cache, keep the newest 12
          git clone -q --depth 1 --branch drive-cache "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" /tmp/out 2>/dev/null || mkdir -p /tmp/out
          cd /tmp/out && rm -rf .git && ls -t | tail -n +13 | xargs -r -d "\n" rm -f --; cd -
          while read -r id name; do
            [ -z "$id" ] && continue
            curl -sfL -o "/tmp/out/$name" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" || echo "fail $id"
          done < drive/wanted.txt
          cd /tmp/out && git init -q && git checkout -q --orphan drive-cache
          git config user.name "drive-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "drive cache"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" drive-cache
