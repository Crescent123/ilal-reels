name: fetch-thumbnails
on:
  push:
    paths: ["thumbs/wanted.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing YouTube thumbnails
        run: |
          while read -r id; do
            [ -z "$id" ] && continue
            f="thumbs/$id.jpg"; [ -s "$f" ] && continue
            curl -sfL -o "$f" "https://i.ytimg.com/vi/$id/maxresdefault.jpg" || curl -sfL -o "$f" "https://i.ytimg.com/vi/$id/hqdefault.jpg" || rm -f "$f"
          done < thumbs/wanted.txt
      - name: Commit
        run: |
          git config user.name "thumb-bot"; git config user.email "actions@users.noreply.github.com"
          git add thumbs/*.jpg 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Add thumbnails" && git push)
