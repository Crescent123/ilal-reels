<html><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url('Cairo.ttf');font-weight:200 1000}
body{margin:0;width:1080px;height:1920px;background:#0b0b0b;overflow:hidden;font-family:Cairo,sans-serif}
svg text{font-family:Cairo}
#cap{position:absolute;top:1340px;left:80px;width:840px;height:120px;display:flex;align-items:center;justify-content:center;direction:rtl}
#cap span{background:#fff;color:#000;font-weight:900;padding:4px 22px;border-radius:14px;white-space:nowrap;display:inline-block}
</style></head><body>
<svg id="g" width="1080" height="1920" style="position:absolute;top:0;left:0"></svg>
<div id="cap"></div>
<script>
// Ep04 «العقد القديم» — helpers from ep02/ep03, scenes rewritten.
let D={};
const RED='#e63946', W='#fff', PINK='#ff7eb6', GOLD='#ffd166', GREY='#666';
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x,0,1);return 1-Math.pow(1-x,3)};
const back=x=>{x=cl(x,0,1);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const P=(t,a,b)=>ease((t-a)/Math.max(.01,b-a));
const PB=(t,a,b)=>back((t-a)/Math.max(.01,b-a));
function T(x,y,s,c,o,str,w){return `<text x="${x}" y="${y}" fill="${c}" font-size="${s}" font-weight="${w||900}" text-anchor="middle" direction="rtl" opacity="${o==null?1:o}">${str}</text>`;}
function TL(x,y,s,c,o,str,w){return `<text x="${x}" y="${y}" fill="${c}" font-size="${s}" font-weight="${w||900}" text-anchor="middle" opacity="${o==null?1:o}">${str}</text>`;}
function popT(t,t0,x,y,s,c,str,latin){const k=PB(t,t0,t0+.45);if(t<t0)return '';return `<g transform="translate(${x},${y}) scale(${k})">${(latin?TL:T)(0,0,s,c,cl((t-t0)*4,0,1),str)}</g>`;}
// stick figure. arm: down|up|reach|hug|point|cross|chest|lift ; angry, sad, tear, op, walk, face
function fig(x,y,col,s,o){o=o||{};const f=o.face||1;const w=o.walk||0;const leg=Math.sin(w)*28, armw=Math.sin(w)*20;
 let arms;
 if(o.arm==='up') arms=`<line x1="0" y1="72" x2="-55" y2="10"/><line x1="0" y1="72" x2="55" y2="10"/>`;
 else if(o.arm==='reach') arms=`<line x1="0" y1="72" x2="${-40*f}" y2="125"/><line x1="0" y1="72" x2="${70*f}" y2="80"/>`;
 else if(o.arm==='hug') arms=`<line x1="0" y1="72" x2="${60*f}" y2="70"/><line x1="0" y1="80" x2="${60*f}" y2="100"/>`;
 else if(o.arm==='point') arms=`<line x1="0" y1="72" x2="${-42*f}" y2="125"/><line x1="0" y1="72" x2="${88*f}" y2="${58+(o.jab||0)}"/>`;
 else if(o.arm==='cross') arms=`<line x1="0" y1="72" x2="${32}" y2="100"/><line x1="0" y1="72" x2="${-32}" y2="100"/><line x1="-34" y1="100" x2="34" y2="100"/>`;
 else if(o.arm==='chest') arms=`<line x1="0" y1="72" x2="${-42*f}" y2="125"/><path d="M 0 72 L ${30*f} 108 L ${8*f} 98"/>`;
 else if(o.arm==='lift') arms=`<line x1="0" y1="72" x2="${-42*f}" y2="125"/><line x1="0" y1="72" x2="${40*f}" y2="-2"/>`;
 else arms=`<line x1="0" y1="72" x2="${-50+armw}" y2="122"/><line x1="0" y1="72" x2="${50-armw}" y2="122"/>`;
 let face='';
 if(o.angry) face+=`<g stroke-width="6"><line x1="-24" y1="-20" x2="-6" y2="-10"/><line x1="24" y1="-20" x2="6" y2="-10"/></g>`;
 if(o.sad) face+=`<path d="M -12 18 Q 0 8 12 18" stroke="${col}" stroke-width="5" fill="none"/>`;
 if(o.smile) face+=`<path d="M -13 10 Q 0 22 13 10" stroke="${col}" stroke-width="5" fill="none"/>`;
 if(o.tear) face+=`<path d="M ${-14*f} ${2+o.tear*20} q -6 10 0 14 q 6 -4 0 -14" fill="#7ec8ff" stroke="none"/>`;
 return `<g transform="translate(${x},${y}) scale(${s})" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${o.op==null?1:o.op}">
 <circle cx="0" cy="0" r="34"/>${face}<line x1="0" y1="34" x2="0" y2="150"/>${arms}
 <line x1="0" y1="150" x2="${-38+leg}" y2="235"/><line x1="0" y1="150" x2="${38-leg}" y2="235"/></g>`;}
function heart(x,y,s,o,col){return `<path transform="translate(${x},${y}) scale(${s})" opacity="${o}" fill="${col||RED}" stroke="none" d="M0 30 C -40 -5,-30 -45,0 -20 C 30 -45,40 -5,0 30Z"/>`;}
function bolt(x,y,s,o,r){return `<path transform="translate(${x},${y}) rotate(${r||0}) scale(${s})" opacity="${o}" fill="${GOLD}" d="M10 -40 L -20 5 L 0 5 L -10 40 L 22 -8 L 2 -8 Z"/>`;}
function bubble(x,y,str,o,s,dark){if(o<=0)return '';return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s||1})"><rect x="-230" y="-55" width="460" height="95" rx="40" fill="${dark?RED:'#fff'}"/><path d="M -20 38 L 0 70 L 20 38 Z" fill="${dark?RED:'#fff'}"/>${T(0,14,40,dark?'#fff':'#000',1,str)}</g>`;}
function xmark(x,y,s,o,col){return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})" stroke="${col||RED}" stroke-width="16" stroke-linecap="round"><line x1="-40" y1="-40" x2="40" y2="40"/><line x1="40" y1="-40" x2="-40" y2="40"/></g>`;}
function ball(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><circle r="30" fill="${GOLD}"/>${T(0,14,40,'#000',1,'!')}</g>`;}
function box(x,y,s,o,label,fs,bw){bw=bw||170;return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})"><rect x="${-bw/2}" y="-70" width="${bw}" height="140" rx="18" fill="${RED}" stroke="#fff" stroke-width="6"/>${T(0,16,fs||44,'#fff',1,label||'غلطة')}</g>`;}
function cal(x,y,s,label,o){return `<g opacity="${o==null?1:o}" transform="translate(${x},${y}) scale(${s})"><rect x="-110" y="-95" width="220" height="200" rx="20" fill="#fff"/><rect x="-110" y="-95" width="220" height="56" rx="20" fill="${RED}"/><rect x="-110" y="-60" width="220" height="21" fill="${RED}"/>${T(0,50,52,'#000',1,label)}</g>`;}
function loopArrow(x,y,r,a,o){const p=[];for(let i=0;i<=40;i++){const u=a+i/40*5.2;p.push((i?'L':'M')+(x+Math.cos(u)*r).toFixed(1)+' '+(y+Math.sin(u)*r).toFixed(1));}const e=a+5.2;const ex=x+Math.cos(e)*r,ey=y+Math.sin(e)*r;
 return `<g opacity="${o}"><path d="${p.join('')}" stroke="${GOLD}" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="16" fill="${GOLD}"/></g>`;}
function gavel(x,y,s,r){return `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})"><rect x="-12" y="0" width="24" height="170" rx="10" fill="#c98a4b"/><rect x="-70" y="-45" width="140" height="70" rx="16" fill="#8b5a2b" stroke="#fff" stroke-width="5"/></g>`;}
function shield(x,y,s,r,o){return `<g opacity="${o==null?1:o}" transform="translate(${x},${y}) rotate(${r}) scale(${s})"><path d="M0 -70 L 60 -45 L 52 30 Q 30 70 0 85 Q -30 70 -52 30 L -60 -45 Z" fill="#333" stroke="${RED}" stroke-width="8"/></g>`;}
function clip(x,y,s,n){let r='';for(let i=0;i<4;i++){r+=`<line x1="-50" y1="${-40+i*38}" x2="40" y2="${-40+i*38}" stroke="#999" stroke-width="6"/>`;if(i<n)r+=`<g transform="translate(55,${-40+i*38})" stroke="${RED}" stroke-width="7"><line x1="-10" y1="-10" x2="10" y2="10"/><line x1="10" y1="-10" x2="-10" y2="10"/></g>`;}
 return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-80" y="-95" width="170" height="210" rx="14" fill="#fff"/><rect x="-25" y="-108" width="60" height="26" rx="8" fill="#555"/>${r}</g>`;}

function snow(x,y,s,o,r){let p='';for(let i=0;i<3;i++)p+=`<line x1="0" y1="-40" x2="0" y2="40" transform="rotate(${i*60})"/>`;return `<g opacity="${o}" transform="translate(${x},${y}) rotate(${r||0}) scale(${s})" stroke="#8fd3ff" stroke-width="8" stroke-linecap="round">${p}</g>`;}
function meter(x,y,lab,v,col,o){return `<g opacity="${o}" transform="translate(${x},${y})"><rect x="-150" y="-26" width="300" height="52" rx="26" fill="#222" stroke="#555" stroke-width="4"/><rect x="-146" y="-22" width="${292*cl(v,0,1)}" height="44" rx="22" fill="${col}"/>${T(0,-48,42,'#fff',1,lab)}</g>`;}
function sb(x,y,str,o,s,dark,fs){if(o<=0)return '';fs=fs||40;const w=Math.min(800,60+str.length*fs*.52);return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s||1})"><rect x="${-w/2}" y="${-fs*1.05}" width="${w}" height="${fs*1.9}" rx="${fs*.8}" fill="${dark?RED:'#fff'}"/><path d="M -16 ${fs*.84} L 0 ${fs*1.5} L 16 ${fs*.84} Z" fill="${dark?RED:'#fff'}"/>${T(0,fs*.33,fs,dark?'#fff':'#000',1,str)}</g>`;}
function pillar(x,y,h,lab,sub,col,r,o){return `<g opacity="${o}" transform="translate(${x},${y}) rotate(${r})"><rect x="-85" y="${-h}" width="170" height="${h}" rx="12" fill="${col}"/>${T(0,-h/2,38,'#000',1,lab)}${T(0,-h/2+46,28,'#000',1,sub,700)}</g>`;}

function scroll(x,y,s,open,o,lines,torn){const h=40+360*open;let l='';for(let i=0;i<(lines||0);i++)l+=`<line x1="-120" y1="${-h/2+70+i*48}" x2="${i%2?60:110}" y2="${-h/2+70+i*48}" stroke="#7a5a2b" stroke-width="8" stroke-linecap="round"/>`;
 const body=`<rect x="-150" y="${-h/2}" width="300" height="${h}" fill="#f3e3c3"/>${l}<rect x="-170" y="${-h/2-22}" width="340" height="34" rx="17" fill="#c9a36a"/><rect x="-170" y="${h/2-12}" width="340" height="34" rx="17" fill="#c9a36a"/>`;
 if(!torn) return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})">${body}</g>`;
 return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})"><g transform="translate(${-torn*80},${torn*50}) rotate(${-torn*18})"><clipPath id="cl"><path d="M -200 -300 L 10 -300 L -20 -100 L 20 50 L -10 300 L -200 300 Z"/></clipPath><g clip-path="url(#cl)">${body}</g></g><g transform="translate(${torn*80},${torn*50}) rotate(${torn*18})"><clipPath id="cr"><path d="M 200 -300 L 10 -300 L -20 -100 L 20 50 L -10 300 L 200 300 Z"/></clipPath><g clip-path="url(#cr)">${body}</g></g></g>`;}
function coin(x,y,s,o){return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})"><circle r="34" fill="${GOLD}" stroke="#b8860b" stroke-width="6"/>${TL(0,13,30,'#000',1,'DH')}</g>`;}
function house(x,y,s,o){return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})" stroke="#fff" stroke-width="8" fill="none" stroke-linejoin="round"><path d="M -70 -10 L 0 -70 L 70 -10"/><rect x="-52" y="-12" width="104" height="80"/><rect x="-14" y="28" width="28" height="40" fill="${RED}" stroke="none"/></g>`;}
function bag(x,y,s,o){return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})"><rect x="-38" y="-26" width="76" height="56" rx="8" fill="#8b5a2b" stroke="#fff" stroke-width="4"/><rect x="-14" y="-38" width="28" height="14" rx="5" fill="none" stroke="#fff" stroke-width="4"/></g>`;}
function batt(x,y,s,v,o){const c=v<.3?RED:(v<.6?GOLD:'#5c5');return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})"><rect x="-50" y="-24" width="100" height="48" rx="8" fill="none" stroke="#fff" stroke-width="5"/><rect x="50" y="-10" width="10" height="20" fill="#fff"/><rect x="-45" y="-19" width="${90*v}" height="38" rx="4" fill="${c}"/></g>`;}
function clock(x,y,s,o,tt){const a=tt*2;return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s})"><circle r="70" fill="#fff"/><line x1="0" y1="0" x2="${Math.sin(a)*45}" y2="${-Math.cos(a)*45}" stroke="#000" stroke-width="8" stroke-linecap="round"/><line x1="0" y1="0" x2="${Math.sin(a/12)*30}" y2="${-Math.cos(a/12)*30}" stroke="${RED}" stroke-width="10" stroke-linecap="round"/>${TL(0,115,44,'#fff',1,'19:00')}</g>`;}
function thought(x,y,str,o,s){if(o<=0)return '';const w=60+str.length*20;return `<g opacity="${o}" transform="translate(${x},${y}) scale(${s||1})"><rect x="${-w/2}" y="-42" width="${w}" height="80" rx="40" fill="#2a2a2a" stroke="#888" stroke-width="4"/>${T(0,12,38,'#fff',1,str)}</g>`;}
function render(t){
 const S=D.s, A=D.t; let g=''; let sc=0;
 for(let i=0;i<S.length;i++) if(t>=S[i]) sc=i;
 const ls=t-S[sc], le=(S[sc+1]||D.dur)-S[sc];
 const zoom=1+0.05*cl(ls/le,0,1);
 const fadeIn=sc===0?1:P(t,S[sc],S[sc]+.25);
 if(sc>=1&&sc<5) g+=T(540,300,58,'#fff',.9,'العقد القديم 📜');
 const FY=840;
 if(sc===0){ // HOOK: couple + an invisible contract unrolling between them
   const op=P(t,0,1.2);
   g+=fig(250,FY,W,.9,{arm:'reach',face:1,smile:1})+fig(830,FY,RED,.9,{arm:'reach',face:-1,smile:1});
   g+=scroll(540,800,1,op,1,0);
   g+=popT(t,.0,540,430,96,'#fff','العقد القديم');
   if(t>A[1]){ g+=popT(t,A[1],540,800,130,'#7a5a2b','؟'); g+=popT(t,A[1]+.3,540,1180,52,GOLD,'حتى واحد ما كتبو'); }
 }
 if(sc===1){ // the old deal
   g+=fig(330,FY,W,1.0,{arm:'down',face:1,smile:t<A[4]})+fig(750,FY,RED,1.0,{arm:'down',face:-1,smile:t<A[4]});
   if(t<A[4]){
     g+=bag(395,FY+130,1.1,P(t,A[2],A[2]+.3));
     for(let i=0;i<3;i++){const t0=A[2]+.3+i*.35;g+=coin(250+i*80,560-(1-P(t,t0,t0+.4))*80,1,P(t,t0,t0+.3));}
     g+=house(750,560,1.2*PB(t,A[3],A[3]+.4),P(t,A[3],A[3]+.2));
     g+=fig(610,FY+110,PINK,.4,{op:P(t,A[3]+.5,A[3]+.8),face:-1})+fig(660,FY+120,'#bbb',.35,{op:P(t,A[3]+.7,A[3]+1.0),face:-1});
   } else {
     const tilt=t<A[5]?12*Math.sin(cl((t-A[4])*2,0,1)*1.57):12*(1-P(t,A[5],A[5]+.8));
     g+=`<g transform="translate(540,600) rotate(${tilt})"><line x1="-230" y1="0" x2="230" y2="0" stroke="#fff" stroke-width="8"/><circle cx="-230" cy="30" r="40" fill="none" stroke="#fff" stroke-width="6"/><circle cx="230" cy="30" r="40" fill="none" stroke="${RED}" stroke-width="6"/></g><line x1="540" y1="600" x2="540" y2="760" stroke="#fff" stroke-width="8"/>`;
     if(t<A[5]) g+=popT(t,A[4],540,500,64,GOLD,'عادل؟ 🤔');
     else { g+=popT(t,A[5],340,1200,46,'#5c5','✓ عارف دورو'); g+=popT(t,A[5]+.4,730,1200,46,'#5c5','✓ عارفة دورها'); }
   }
 }
 if(sc===2){ // today
   if(t<A[8]){
     const wk=t<A[7]?t*10:0;
     const v=1-.85*P(t,A[6],A[7]+1);
     g+=fig(330,FY,W,1.0,{walk:wk,face:1,sad:t>A[7]})+bag(395,FY+130,1,1);
     g+=fig(750,FY,RED,1.0,{walk:wk,face:-1,sad:t>A[7]})+bag(685,FY+130,1,1);
     g+=batt(330,600,1,v,1)+batt(750,600,1,v,1);
     if(t<A[7]) g+=popT(t,A[6],540,470,62,GOLD,'بجوج خدامين 💼');
     else { g+=clock(540,700,1.1*PB(t,A[7],A[7]+.4),1,t); g+=popT(t,A[7],540,470,62,'#bbb','عيانين 😮‍💨'); }
   } else {
     const tr=P(t,A[8]+.3,A[8]+1.1);
     if(t<A[9]) g+=scroll(540,760,1,1,1,5,tr>0?tr:0);
     else { g+=scroll(540,760,1,1,.25,5,1); g+=`<g transform="translate(540,760) scale(${PB(t,A[9],A[9]+.4)})"><rect x="-140" y="-180" width="280" height="360" fill="#fff"/>${T(0,40,150,'#ccc',1,'؟')}</g>`; g+=popT(t,A[9]+.3,540,1200,54,GOLD,'والعقد الجديد؟ ما كاينش'); }
     if(t<A[9]) g+=popT(t,A[8]+.2,540,470,64,RED,'تقطع ✂️');
   }
 }
 if(sc===3){ // secret scoreboard -> mental load
   if(t<A[12]){
     const n1=t>A[11]?1+Math.floor(P(t,A[11],A[11]+2.2)*4):0, n2=t>A[11]+.4?1+Math.floor(P(t,A[11]+.4,A[11]+2.4)*4):0;
     g+=`<g transform="translate(540,560)"><rect x="-300" y="-90" width="600" height="180" rx="22" fill="#111" stroke="#555" stroke-width="6"/>${T(-150,40,110,'#fff',1,''+n1)}${T(150,40,110,RED,1,''+n2)}${T(0,30,70,'#777',1,'-')}</g>`;
     g+=popT(t,A[10]+.2,540,420,48,'#999','🤫 الحساب فالسر');
     g+=fig(330,FY+60,W,.9,{face:1,angry:t>A[11],arm:'cross'})+fig(750,FY+60,RED,.9,{face:-1,angry:t>A[11],arm:'cross'});
     if(t>A[11]){ g+=sb(330,800,'«أنا خدمت كثر»',P(t,A[11],A[11]+.2),PB(t,A[11],A[11]+.35),0,36); g+=sb(750,800,'«أنا تعبت كثر»',P(t,A[11]+.9,A[11]+1.1),PB(t,A[11]+.9,A[11]+1.25),1,36); }
   } else {
     g+=fig(540,FY+120,W,.85,{face:1,sad:t>A[14]});
     const items=[['🍲 شنو غادي ناكلو؟',A[15]],['💡 شكون يخلص الضو؟',A[16]],['📅 موعد الطبيب',A[16]+.6],['🧺 الصابون سالا',A[16]+1.0]];
     if(t<A[13]) g+=popT(t,A[12],540,640,180,'#fff','🧠');
     if(t<A[14]&&t>=A[13]) g+=popT(t,A[13],540,560,100,'#fff','العبء الذهني');
     else { g+=popT(t,A[14],540,470,54,GOLD,'الشغل اللي ما كيبانش 👻');
       items.forEach((it,i)=>{ if(t>it[1]) g+=thought(540+(i%2?60:-60),560+i*88,it[0],P(t,it[1],it[1]+.25),PB(t,it[1],it[1]+.4)); });
       const sq=1-.12*P(t,A[15],A[16]+1.5); g+=`<g transform="translate(540,${FY+40}) scale(1,${sq}) translate(-540,${-FY-40})"></g>`; }
   }
 }
 if(sc===4){ // not her, not him — the contract
   if(t<A[19]){
     g+=fig(330,FY,RED,1.0,{face:1,smile:1})+bag(395,FY+130,1,1);
     g+=popT(t,A[17]+.1,330,1190,46,'#5c5','ماشي هي')+popT(t,A[17]+.1,330,1250,46,'#5c5','المشكل ✓');
     if(t>A[18]){ g+=fig(750,FY,W,1.0,{face:-1,smile:1}); g+=`<rect x="715" y="${FY+60}" width="70" height="90" rx="10" fill="${PINK}" opacity=".85"/>`; g+=popT(t,A[18]+.1,750,1190,46,'#5c5','ماشي هو')+popT(t,A[18]+.1,750,1250,46,'#5c5','المشكل ✓'); }
   } else {
     g+=popT(t,A[19],540,470,58,'#fff','قواعد جديدة 📱');
     g+=`<g transform="translate(360,800) scale(${PB(t,A[19],A[19]+.4)})"><rect x="-120" y="-150" width="240" height="300" rx="24" fill="#fff"/>${T(0,10,44,'#000',1,'2026')}</g>`;
     if(t>A[20]){ g+=scroll(740,800,.7,1,1,4,.15); g+=popT(t,A[20],740,1080,52,'#c9a36a','عقد قديم'); g+=xmark(550,800,1.1,P(t,A[20]+.3,A[20]+.5),GOLD); }
   }
 }
 if(sc===5){ // punch: write your own contract
   if(t<A[23]){
     g+=`<rect x="200" y="1010" width="680" height="24" rx="10" fill="#555"/>`;
     g+=fig(250,FY+10,W,.85,{arm:'reach',face:1,smile:1})+fig(830,FY+10,RED,.85,{arm:'reach',face:-1,smile:1});
